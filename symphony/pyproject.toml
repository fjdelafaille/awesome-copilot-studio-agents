[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "symphony"
version = "0.1.0"
description = "Orchestration daemon that continuously runs coding-agent sessions for Linear issues"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.scripts]
symphony = "symphony.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["symphony*"]
